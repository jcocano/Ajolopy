[project]
name = "web-research"
version = "0.0.1"
description = "Runnable example: a web research agent that calls Tavily via @Tool (AJ-65)."
requires-python = ">=3.14"
dependencies = [
    "ajolopy",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = true

[tool.uv.sources]
# Path-mounted editable dependency: the example stays self-contained inside
# the Ajolopy repository so `uv sync` works on a fresh clone — no published
# PyPI release required while v0.1 is in development.
ajolopy = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_research"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
