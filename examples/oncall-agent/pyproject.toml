[project]
name = "oncall-agent"
version = "0.0.1"
description = "Runnable Ajolopy example: on-call agent via @MCP + GitHub MCP server (AJ-63)."
requires-python = ">=3.14"
dependencies = [
    "ajolopy",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
# Pulls the official Model Context Protocol SDK so the `Integrations` `@MCP`
# block can actually open the stdio transport to the GitHub MCP server. The
# example boots without this extra — the MCP layer marks the server unhealthy
# and the agent's local tool still answers.
mcp = [
    "ajolopy[mcp]",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = true

[tool.uv.sources]
# Path-mounted editable dependency: keeps the example self-contained inside
# the Ajolopy repository so `uv sync` works on a fresh clone — no published
# PyPI release required while v0.1 is in development.
ajolopy = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oncall_agent"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
