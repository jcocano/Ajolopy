[project]
name = "local-ollama"
version = "0.0.1"
description = "Local code reviewer running on Ollama via Ajolopy's universal OpenAI-compatible provider (AJ-66) — no API key required."
requires-python = ">=3.14"
dependencies = [
    "ajolopy",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = true

[tool.uv.sources]
# Path-mounted editable dependency: the example stays self-contained
# inside the Ajolopy repository so `uv sync` works on a fresh clone — no
# published PyPI release required while v0.1 is in development.
ajolopy = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_ollama"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
