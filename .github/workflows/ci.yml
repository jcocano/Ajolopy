name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  board:
    name: Validate board.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --frozen
      - name: Validate board.json
        run: uv run python tools/board.py validate

  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check
      - name: ruff format --check
        run: uv run ruff format --check

  typecheck:
    name: pyright --strict
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Install dependencies
        # Pull the `otel` + `mcp` extras so pyright can resolve the SDK
        # imports used by `ajolopy.observability.tracing`,
        # `ajolopy.mcp.*`, and `ajolopy.mcp_server.*`. Pull the
        # `redis` + `postgres` + `mongo` extras so the AJ-24 memory
        # backends import cleanly under strict typing. End-user
        # installs still keep every SDK opt-in.
        run: uv sync --frozen --extra otel --extra mcp --extra redis --extra postgres --extra mongo
      - name: pyright
        run: uv run pyright

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        # Pull the `otel` + `mcp` extras so the observability and
        # mcp/mcp_server test suites can import the SDKs. Pull the
        # `redis` + `postgres` + `mongo` extras so the AJ-24 memory
        # backends can import their SDKs at test time. Every extra
        # stays opt-in for end users.
        run: uv sync --frozen --extra otel --extra mcp --extra redis --extra postgres --extra mongo
      - name: pytest
        run: uv run pytest

  osv-scanner:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install OSV Scanner
        run: |
          version="2.3.8"
          curl -fsSL "https://github.com/google/osv-scanner/releases/download/v${version}/osv-scanner_linux_amd64" -o osv-scanner
          chmod +x osv-scanner
          ./osv-scanner --version
      - name: Scan dependencies
        run: ./osv-scanner scan source -r .
