name: Sync LiteLLM pricing snapshot

on:
  schedule:
    # First day of every month at 09:00 UTC. Matches the cadence the spec
    # locked for AJ-30 — a monthly cron is frequent enough to keep up with
    # LiteLLM price changes without flooding reviewers with PRs.
    - cron: '0 9 1 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Detect drift + open PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check pricing drift
        id: check
        run: |
          set +e
          uv run python tools/sync_pricing.py --check | tee /tmp/sync-pricing-diff.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
      - name: Resolve upstream HEAD SHA
        if: steps.check.outputs.exit_code != '0'
        id: head
        run: |
          set -eu
          sha="$(git ls-remote https://github.com/BerriAI/litellm.git HEAD | awk '{print $1}')"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Upstream HEAD: ${sha}"
      - name: Rewrite snapshot to upstream
        if: steps.check.outputs.exit_code != '0'
        run: |
          uv run python tools/sync_pricing.py --write --head-sha "${{ steps.head.outputs.sha }}"
      - name: Open sync PR
        if: steps.check.outputs.exit_code != '0'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: chore/pricing-sync
          base: main
          delete-branch: true
          commit-message: |
            chore(pricing): sync LiteLLM snapshot ${{ steps.head.outputs.sha }}
          title: "chore(pricing): sync LiteLLM snapshot"
          body-file: /tmp/sync-pricing-diff.txt
          labels: |
            pricing
            dependencies
