# AJ-47 — mkdocs-material site configuration.
#
# Builds with: `uv run mkdocs build --strict`
# Local dev:   `uv run mkdocs serve`
# Deploys via `.github/workflows/docs.yml` to GitHub Pages on push to main.
#
# Future items (AJ-52 deploy recipes) will extend the `nav:` tree additively —
# keep the existing entries ordered for the happy-path reader
# (Home -> Quickstart -> Install -> Tutorial -> Reference -> Recipes -> Next steps).

site_name: Ajolopy
site_description: AI-native production framework for Python.
site_url: https://jcocano.github.io/Ajolopy/
repo_url: https://github.com/jcocano/Ajolopy
repo_name: jcocano/Ajolopy
edit_uri: edit/main/docs/

# Fail the build if a docs link points at a file that does not exist. Keeps
# `mkdocs build --strict` honest as the smoke test.
strict: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Install: install.md
  - Tutorial:
      - Overview: tutorial/index.md
      - "Step 1 — Hello to prod": tutorial/step-1-hello.md
      - "Step 2 — Evals": tutorial/step-2-evals.md
      - "Step 3 — Equipo": tutorial/step-3-team.md
  - Reference:
      - Overview: reference/index.md
      - "@Agent": reference/agent.md
      - "@Tool": reference/tool.md
      - "@Stream": reference/stream.md
      - "@Workflow": reference/workflow.md
      - "@MCP": reference/mcp.md
      - "@MCPServer": reference/mcp-server.md
      - "@Eval": reference/eval.md
      - "@Module": reference/module.md
      - "@Injectable": reference/injectable.md
      - "@Controller": reference/controller.md
      - "@UseGuards": reference/use-guards.md
      - "ajolopy deploy": reference/cli-deploy.md
  - Recipes:
      - Observability:
          - Overview: recipes/observability/index.md
          - Langfuse: recipes/observability/langfuse.md
          - Sentry: recipes/observability/sentry.md
          - Grafana stack: recipes/observability/grafana.md
          - Honeycomb: recipes/observability/honeycomb.md
          - Datadog: recipes/observability/datadog.md
  - Contributing:
      - "Releasing to PyPI": contributing/release.md
  - Next steps: next-steps.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css
