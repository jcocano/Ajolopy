[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ajolopy"
version = "0.1.2"
description = "The Python framework for building AI-native applications in production."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [
    { name = "Jesus Cocaño", email = "jesus.cocano@gmail.com" },
]
keywords = ["ai", "framework", "agents", "llm", "mcp", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=0.101.0",
    "google-genai>=2.2.0",
    "openai>=2.36.0",
    "opentelemetry-api>=1.41.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "starlette>=1.0.0",
    "structlog>=24.1.0",
    "tiktoken>=0.12.0",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
# Observability: install the OTel SDK + an OTLP HTTP exporter so the spans
# emitted by `@Agent`, the provider layer, and tool dispatch get exported to
# any compliant backend (Langfuse, Honeycomb, Grafana Tempo, Datadog, Sentry).
# Without this extra, the framework still calls into the OTel api but every
# span is a cheap no-op (no recording, no export).
otel = [
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-exporter-otlp-proto-http>=1.41.1",
]
# MCP (AJ-7): install the official Model Context Protocol SDK so the
# built-in `StdioMCPClient` / `HTTPMCPClient` / `SSEMCPClient` transports
# can actually connect. Without this extra `from ajolopy import MCP` and
# `@MCP(servers={...})` still work (validation only); attempting to
# connect raises `MCPDependencyError` with a `pip install` hint.
mcp = [
    "mcp>=1.0.0",
]
# Memory backends (AJ-24): each backend's SDK is opt-in so importing
# `ajolopy.memory` stays dependency-free. Without the matching extra,
# `RedisMemory` / `PostgresMemory` / `MongoDBMemory` raise
# `MemoryDependencyError` at construction with a `pip install` hint.
redis = [
    "redis>=5.0",
]
postgres = [
    "asyncpg>=0.30",
]
mongo = [
    "motor>=3.6",
]
# Convenience meta-extra: install every memory backend SDK at once.
memory-all = [
    "redis>=5.0",
    "asyncpg>=0.30",
    "motor>=3.6",
]
# RAG retrievers (AJ-62): each backend's SDK is opt-in so importing
# `ajolopy.rag` stays dependency-free. Without the matching extra,
# `QdrantRetriever` / `PgvectorRetriever` raise
# `RetrieverDependencyError` at construction with a `pip install` hint.
qdrant = [
    "qdrant-client>=1.10",
]
pgvector = [
    "asyncpg>=0.30",
    "pgvector>=0.3",
]

[project.urls]
Homepage = "https://github.com/jcocano/ajolopy"
Repository = "https://github.com/jcocano/ajolopy"

# Console scripts: the ``ajolopy`` binary dispatches to ``ajolopy.cli.main``.
# AJ-60 ships the first subcommand (``mcp-serve``); future items (AJ-32 ff)
# register additional subcommands without changing the entry point.
[project.scripts]
ajolopy = "ajolopy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ajolopy"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ajolopy",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pyright>=1.1.380",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
    "jsonschema>=4.23.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    # AJ-24 — deterministic fakes for memory-backend tests so the suite
    # never depends on a running Redis / MongoDB server.
    "fakeredis>=2.0",
    "mongomock-motor>=0.0.30",
]
# AJ-47 — docs site (mkdocs-material). Kept out of the runtime install so
# end users never pull mkdocs as a transitive dependency. CI installs this
# group only for the docs build/deploy workflow.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

# ---------------------------------------------------------------------------
# ruff — lint + format (replaces black, isort, flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "PT",   # flake8-pytest-style
    "ANN",  # flake8-annotations
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (no commented-out code)
    "S",    # flake8-bandit (SAST)
]
ignore = [
    "ANN401",  # framework decorators legitimately need `Any` in some signatures
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use bare `assert` (S101) and untyped pytest fixtures.
# TC: tests import framework types at runtime so introspection can resolve
# them via get_type_hints; ruff's "move to TYPE_CHECKING" suggestion does not
# apply.
"tests/**" = ["ANN", "ARG", "PT011", "RUF012", "S101", "TC"]
# The runnable AJ-50 (support-agent) and AJ-64 (memory-assistant) examples
# ship their own `tests/` directories; same rationale as the framework's own
# `tests/` tree.
"examples/**/tests/**" = ["ANN", "ARG", "PT011", "RUF012", "S101", "TC"]
# The AJ-54 dogfood docs bot ships its own `tests/` directory; same
# rationale as the framework's own `tests/` tree.
"dogfood/**/tests/**" = ["ANN", "ARG", "PT011", "RUF012", "S101", "TC"]
# Internal tools intentionally call PATH-resolved binaries (e.g. `git`).
"tools/**" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["ajolopy", "tools"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# pyright — strict typing (the framework MUST type its own decorators correctly).
# Matches Anthropic's public Python projects.
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests", "tools"]
extraPaths = ["."]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnnecessaryTypeIgnoreComment = "warning"
reportImplicitOverride = "warning"
reportPrivateUsage = "warning"
executionEnvironments = [
    { root = "tests", reportMissingParameterType = "none", reportUnknownParameterType = "none", reportPrivateUsage = "none", reportUnusedClass = "none", reportUnknownMemberType = "none", reportUnknownVariableType = "none", reportUnknownArgumentType = "none" },
    # AJ-50 — the runnable support-agent example is type-checked when CI
    # runs `uv run pyright examples/support-agent`. `extraPaths` adds the
    # example's `src/` to the import resolver so `support_agent.*` modules
    # resolve from the eval scripts and the smoke test.
    { root = "examples/support-agent", extraPaths = ["examples/support-agent/src"] },
    { root = "examples/support-agent/tests", extraPaths = ["examples/support-agent/src"], reportMissingParameterType = "none", reportUnknownParameterType = "none", reportPrivateUsage = "none", reportUnusedClass = "none", reportUnknownMemberType = "none", reportUnknownVariableType = "none", reportUnknownArgumentType = "none" },
    # AJ-63 — the runnable on-call example. Same treatment as AJ-50:
    # `extraPaths` lets `oncall_agent.*` modules resolve from the eval
    # scripts and the smoke test when CI runs
    # `uv run pyright examples/oncall-agent`.
    { root = "examples/oncall-agent", extraPaths = ["examples/oncall-agent/src"] },
    { root = "examples/oncall-agent/tests", extraPaths = ["examples/oncall-agent/src"], reportMissingParameterType = "none", reportUnknownParameterType = "none", reportPrivateUsage = "none", reportUnusedClass = "none", reportUnknownMemberType = "none", reportUnknownVariableType = "none", reportUnknownArgumentType = "none" },
    # AJ-64 — the runnable memory-assistant example is type-checked the
    # same way as the AJ-50 example. `extraPaths` adds the project's
    # `src/` so `memory_assistant.*` modules resolve from the eval
    # scripts and the smoke test.
    { root = "examples/memory-assistant", extraPaths = ["examples/memory-assistant/src"] },
    { root = "examples/memory-assistant/tests", extraPaths = ["examples/memory-assistant/src"], reportMissingParameterType = "none", reportUnknownParameterType = "none", reportPrivateUsage = "none", reportUnusedClass = "none", reportUnknownMemberType = "none", reportUnknownVariableType = "none", reportUnknownArgumentType = "none" },
    # AJ-54 — the dogfood docs bot is type-checked the same way as the
    # AJ-50 example. `extraPaths` adds the project's `src/` so
    # `docsbot.*` modules resolve from the eval scripts and the smoke
    # test.
    { root = "dogfood/docsbot", extraPaths = ["dogfood/docsbot/src"] },
    { root = "dogfood/docsbot/tests", extraPaths = ["dogfood/docsbot/src"], reportMissingParameterType = "none", reportUnknownParameterType = "none", reportPrivateUsage = "none", reportUnusedClass = "none", reportUnknownMemberType = "none", reportUnknownVariableType = "none", reportUnknownArgumentType = "none" },
    # AJ-65 — the web-research example is type-checked the same way as
    # the AJ-50 / AJ-54 layouts. `extraPaths` adds the project's `src/`
    # so `web_research.*` modules resolve from the eval scripts and the
    # smoke test.
    { root = "examples/web-research", extraPaths = ["examples/web-research/src"] },
    { root = "examples/web-research/tests", extraPaths = ["examples/web-research/src"], reportMissingParameterType = "none", reportUnknownParameterType = "none", reportPrivateUsage = "none", reportUnusedClass = "none", reportUnknownMemberType = "none", reportUnknownVariableType = "none", reportUnknownArgumentType = "none" },
    # AJ-66 — the local-ollama example is type-checked the same way as
    # AJ-50 / AJ-54. `extraPaths` adds the project's `src/` so
    # `local_ollama.*` modules resolve from the eval scripts and the
    # smoke test.
    { root = "examples/local-ollama", extraPaths = ["examples/local-ollama/src"] },
    { root = "examples/local-ollama/tests", extraPaths = ["examples/local-ollama/src"], reportMissingParameterType = "none", reportUnknownParameterType = "none", reportPrivateUsage = "none", reportUnusedClass = "none", reportUnknownMemberType = "none", reportUnknownVariableType = "none", reportUnknownArgumentType = "none" },
    # AJ-67 — the contextual RAG launch example follows the same pattern.
    # `extraPaths` adds the project's `src/` so `contextual_rag.*` modules
    # resolve from the eval suite, the smoke test, and the build script.
    { root = "examples/contextual-rag", extraPaths = ["examples/contextual-rag/src"] },
    { root = "examples/contextual-rag/tests", extraPaths = ["examples/contextual-rag/src"], reportMissingParameterType = "none", reportUnknownParameterType = "none", reportPrivateUsage = "none", reportUnusedClass = "none", reportUnknownMemberType = "none", reportUnknownVariableType = "none", reportUnknownArgumentType = "none" },
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=ajolopy",
    "--cov=tools",
    "--cov-report=term-missing",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/ajolopy"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]
