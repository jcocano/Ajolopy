default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 6fec9b7edb08fd9989088709d864a7826dc74e80  # frozen: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/codespell-project/codespell
    rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a  # frozen: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
        args: [--ignore-words-list=ot,nd]

  - repo: local
    hooks:
      - id: board-validate
        name: validate board.json
        entry: uv run python tools/board.py validate
        language: system
        files: ^(board\.json|\.board-schema\.json|tools/board\.py)$
        pass_filenames: false

      - id: protect-main
        name: refuse direct push to main
        entry: uv run python tools/protect_main.py
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

# pyright runs in CI only — running a type checker in pre-commit can miss
# the real dependency tree and slow the local loop. See .github/workflows/ci.yml.
