[project]
name = "docsbot"
version = "0.0.1"
description = "Ajolopy's own docs bot — dogfood app #1 (AJ-54)."
requires-python = ">=3.14"
dependencies = [
    # >=0.1.5 — AJ-87 fix that mounts @Stream on @Agent classes. Older
    # versions silently skip the /chat route under bare uvicorn (the
    # production path), so any docker build pulling pre-0.1.5 ajolopy
    # from PyPI deploys a 404-on-/chat bot.
    "ajolopy>=0.1.5",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = true

[tool.uv.sources]
# Path-mounted editable dependency: the dogfood app stays self-contained
# inside the Ajolopy repository so `uv sync` works on a fresh clone — no
# published PyPI release required while v0.1 is in development.
ajolopy = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docsbot"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
